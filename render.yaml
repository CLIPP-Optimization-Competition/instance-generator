# Render Blueprint – run from repo root so wsgi.py is found
services:
  - type: web
    name: clipp-instance-generator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    # Do not set rootDirectory – start must run from repo root where wsgi.py is
